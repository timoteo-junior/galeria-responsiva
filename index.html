<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
    <title>Document</title>
</head>
<body>
    <header>
        <h1>Galeria responsiva</h1>
    </header>
        <div class="controles">
            <label for="add-imagem">Adicione uma nova imagem:</label>
            <input type="file" id="add-imagem" accept="image/*">
            <h2>OU</h2>
            <button id="remove-imagem" style="color: black; padding: 5px;">Pressione para remover</button>
            <!-- NOVO BOTÃO DE RESTAURAR -->
            <button id="restore-imagem" style="color: black; padding: 5px; margin-left: 10px;">Restaurar Imagem</button>
        </div>
    </div>
    <div class="container" id="galeria-principal">
        <img src="img/simonb.jpg" alt="simonb">
        <img src="img/cyb.webp" alt="cyberpunk">
        <img src="img/sksg.jpg" alt="silksong">
        <img src="img/hngt.png" alt="hollow">
        <img src="img/gow.jpg" alt="gow">
        <img src="img/terr.jpg" alt="terr">
    </div>
</body>
</html>
